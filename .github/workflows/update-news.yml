name: Update automatic news
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      search_id:
        description: Query identifier
        required: false
        type: string
      search_json:
        description: Public news search conditions
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: automatic-news-${{ inputs.search_id || 'scheduled' }}
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/update-news.mjs
        env:
          NEWS_INGEST_KEY: ${{ secrets.NEWS_INGEST_KEY }}
          NEWS_SEARCH_ID: ${{ inputs.search_id }}
          NEWS_SEARCH_JSON: ${{ inputs.search_json }}
